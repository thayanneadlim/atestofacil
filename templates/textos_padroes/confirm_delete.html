{% extends "base.html" %}
{% block title %}Excluir texto{% endblock %}
{% block content %}
<div class="stat-card col-lg-6">
  <h1 class="h4">Excluir {{ texto.nome }}?</h1>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger" type="submit">Confirmar</button>
    <a href="{% url 'textos_padroes:detail' texto.pk %}" class="btn btn-link">Cancelar</a>
  </form>
</div>
{% endblock %}
