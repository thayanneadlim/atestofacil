{% extends "base.html" %}
{% block title %}Pessoas{% endblock %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
  <h1 class="h3">Pessoas</h1>
  <a href="{% url 'pessoas:create' %}" class="btn btn-primary">Nova pessoa</a>
</div>
<form class="row g-2 mb-3" method="get">
  <div class="col-md-6"><input class="form-control" name="q" value="{{ q }}" placeholder="Buscar por nome ou CPF"></div>
  <div class="col-auto"><button class="btn btn-outline-secondary">Buscar</button></div>
</form>
<table class="table table-hover bg-white">
  <thead><tr><th>Nome</th><th>CPF</th><th>Ativo</th><th></th></tr></thead>
  <tbody>
  {% for p in pessoas %}
    <tr>
      <td><a href="{% url 'pessoas:detail' p.pk %}">{{ p.nome }}</a></td>
      <td>{{ p.cpf_formatado }}</td>
      <td>{% if p.ativo %}Sim{% else %}Não{% endif %}</td>
      <td class="text-end"><a href="{% url 'pessoas:edit' p.pk %}" class="btn btn-sm btn-outline-primary">Editar</a></td>
    </tr>
  {% empty %}
    <tr><td colspan="4" class="text-muted">Nenhuma pessoa cadastrada.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
